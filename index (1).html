<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise for You 🎁</title>
<style>
/* ============ TOKENS ============ */
:root{
  --pink:#ffd3e4; --rose:#ec5f95; --blush:#ffb3cf;
  --lav:#d8c9ff; --lav-deep:#a98ee8;
  --cream:#fff6ea; --plum:#5d3358; --gold:#ffcf6b;
  --script:"Snell Roundhand","Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
  --serif:Georgia,"Palatino Linotype","Book Antiqua",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif);color:var(--plum);overflow:hidden;
  background:linear-gradient(160deg,var(--pink) 0%,var(--lav) 50%,var(--cream) 100%);
  background-size:200% 200%;animation:drift 18s ease-in-out infinite alternate;
}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}

/* soft glowing blobs */
.glow{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
.glow.a{width:45vmax;height:45vmax;left:-15vmax;top:-12vmax;background:#fff}
.glow.b{width:40vmax;height:40vmax;right:-12vmax;bottom:-12vmax;background:var(--blush)}

/* ============ PAGES ============ */
.page{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
  text-align:center;overflow-y:auto;
  opacity:0;visibility:hidden;transform:scale(.97);
  transition:opacity .9s ease,transform .9s ease,visibility 0s linear .9s;
}
.page.active{opacity:1;visibility:visible;transform:none;transition:opacity .9s ease,transform .9s ease}

h1{font-family:var(--script);font-weight:400;font-size:clamp(2.1rem,7vw,3.6rem);line-height:1.15;color:var(--rose);text-shadow:0 3px 14px rgba(255,255,255,.9)}
.sub{margin-top:8px;font-style:italic;font-size:clamp(1rem,3.4vw,1.25rem);color:var(--plum);opacity:.85}

/* ============ CAKE ============ */
.cake-wrap{width:min(78vw,340px);margin-top:10px;filter:drop-shadow(0 18px 22px rgba(169,90,140,.28))}
.cake-wrap svg{width:100%;height:auto;overflow:visible;display:block}

.flame-btn{cursor:pointer;outline:none}
.flame-btn:focus-visible .hit{stroke:var(--rose);stroke-width:2;stroke-dasharray:4 4}
.hit{fill:rgba(255,255,255,0);transition:fill .3s}
.flame-btn:hover .hit{fill:rgba(255,255,255,.35)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite alternate}
.halo{animation:pulse 1.6s ease-in-out infinite}
@keyframes flicker{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(.94,1.08) rotate(2deg)}100%{transform:scale(1.04,.96) rotate(-1deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.18)}}
.halo{transform-box:fill-box;transform-origin:center}

/* tap ring hint */
.tap-ring{fill:none;stroke:var(--rose);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}

/* extinguished state */
.out .flame,.out .halo,.out .tap-ring{animation:none;opacity:0;transform:scale(0);transition:all .45s ease}
.smoke{opacity:0}
.out .smoke{animation:smoke 1.8s ease-out forwards}
@keyframes smoke{0%{opacity:.75;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
.smoke{transform-box:fill-box}

.hint{margin-top:14px;font-size:.95rem;opacity:.75;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ============ PAGE 2 ============ */
.card{
  width:min(92vw,620px);margin:14px 0;padding:clamp(22px,5vw,38px) clamp(20px,5vw,40px);
  background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.9);border-radius:32px;
  box-shadow:0 22px 50px rgba(150,90,160,.22),inset 0 0 30px rgba(255,255,255,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.envelope{font-size:2.2rem;display:block;margin-bottom:4px;animation:bob 2.4s ease-in-out infinite}
.wish{margin-top:16px;font-size:clamp(1.02rem,3.5vw,1.2rem);line-height:1.8;text-align:left;min-height:12em;white-space:pre-line}
.wish .caret{display:inline-block;width:2px;height:1.1em;background:var(--rose);vertical-align:text-bottom;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.divider{margin:14px auto 0;letter-spacing:.6em;color:var(--lav-deep);font-size:.9rem}

.extra{
  max-height:0;opacity:0;overflow:hidden;margin-top:0;
  font-family:var(--script);font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.5;color:var(--rose);
  transition:max-height .9s ease,opacity .9s ease,margin .9s ease;
}
.extra.show{max-height:340px;opacity:1;margin-top:20px}

.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
button{
  font-family:var(--serif);font-size:1.02rem;color:#fff;cursor:pointer;border:0;border-radius:999px;
  padding:13px 26px;min-height:48px;background:linear-gradient(135deg,#f7789f,var(--lav-deep));
  box-shadow:0 8px 20px rgba(236,95,149,.35);transition:transform .2s ease,box-shadow .2s ease,filter .2s;
}
button:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 26px rgba(236,95,149,.45)}
button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
button.ghost{background:rgba(255,255,255,.8);color:var(--rose);box-shadow:0 6px 16px rgba(169,142,232,.3)}
button[hidden]{display:none}


/* ============ EXTRA DECOR ============ */
.bunting{position:fixed;top:0;left:0;right:0;height:64px;z-index:4;pointer-events:none;display:flex;justify-content:space-around;padding-top:2px}
.bunting::before{content:"";position:absolute;left:-2%;right:-2%;top:8px;height:3px;background:rgba(93,51,88,.35);border-radius:3px}
.flag{width:0;height:0;margin-top:9px;border-left:15px solid transparent;border-right:15px solid transparent;border-top:36px solid var(--c);
  transform-origin:50% -8px;animation:sway 3.2s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(93,51,88,.18))}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

.balloon{position:fixed;bottom:-30px;width:54px;height:68px;border-radius:50% 50% 48% 48%;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85) 0 9%,var(--c) 10% 100%);
  box-shadow:inset -6px -8px 14px rgba(93,51,88,.14),0 10px 20px rgba(150,90,160,.15);
  animation:float 5s ease-in-out infinite alternate;opacity:.9}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:90px;background:rgba(93,51,88,.35);transform-origin:top;animation:string 5s ease-in-out infinite alternate}
.balloon::before{content:"";position:absolute;left:calc(50% - 4px);top:calc(100% - 3px);border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--c)}
@keyframes float{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-22px) rotate(4deg)}}
@keyframes string{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
@media (max-width:600px){.balloon.far{display:none}.balloon{width:42px;height:54px}}

.badge{display:inline-block;margin-top:8px;padding:6px 16px;border-radius:999px;font-size:.9rem;font-style:italic;color:var(--plum);
  background:linear-gradient(135deg,#fff,var(--lav));border:1.5px dashed var(--lav-deep);box-shadow:0 4px 12px rgba(169,142,232,.25)}
.card{position:relative}
.card::before{content:"🎀";position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:2.1rem;filter:drop-shadow(0 3px 4px rgba(236,95,149,.3))}
.card::after{content:"✦ ✧ ✦";position:absolute;right:26px;bottom:10px;color:var(--lav-deep);opacity:.7;letter-spacing:.3em;font-size:.8rem}
.cake-wrap{position:relative}
.cake-wrap::before,.cake-wrap::after{content:"🎁";position:absolute;bottom:2%;font-size:clamp(1.6rem,6vw,2.4rem);filter:drop-shadow(0 6px 6px rgba(150,90,160,.25))}
.cake-wrap::before{left:-14%}
.cake-wrap::after{content:"🎊";right:-14%}

/* ============ MUSIC TOGGLE ============ */
.music-btn{position:fixed;top:78px;right:max(14px,env(safe-area-inset-right));z-index:6;width:48px;height:48px;min-height:0;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;line-height:1;border-radius:50%;
  background:rgba(255,255,255,.88);color:var(--rose);box-shadow:0 6px 16px rgba(169,142,232,.35);border:1.5px solid #fff}
.music-btn.playing{animation:bob 1.6s ease-in-out infinite}

/* ============ FX LAYERS ============ */
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#hearts{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:0}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
  10%{opacity:.85}
  100%{transform:translateY(-110vh) translateX(var(--sway)) rotate(var(--rot));opacity:0}
}
.conf{position:absolute;top:-20px;animation:fall var(--dur) cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--spin));opacity:.9}}
.spark{position:absolute;animation:burst .9s ease-out forwards}
@keyframes burst{
  0%{transform:translate(0,0) scale(0);opacity:1}
  100%{transform:translate(var(--sx),var(--sy)) scale(1.3) rotate(120deg);opacity:0}
}
.twinkle{position:absolute;color:#fff;animation:tw 3s ease-in-out infinite;text-shadow:0 0 8px var(--lav-deep)}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}

@media (max-height:640px){.cake-wrap{width:min(56vw,260px)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="glow a"></div><div class="glow b"></div>
<div class="bunting" id="bunting" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>

<!-- Real audio files (you add these to the "audio" folder). If missing, a built-in fallback is used. -->
<audio id="songAudio" src="audio/happy-birthday.mp3" preload="auto"></audio>
<audio id="popAudio" src="audio/party-popper.mp3" preload="auto"></audio>

<button class="music-btn" id="musicBtn" type="button" aria-label="Mute birthday song" title="Mute birthday song" hidden>🎵</button>

<!-- ================= PAGE 1 ================= -->
<main class="page active" id="page1">
  <h1>A Little Surprise for You 🎁</h1>
  <p class="sub">Make a wish and tap the candle flame ✨</p>

  <div class="cake-wrap" id="cake">
    <svg viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pink birthday cake with a lit candle">
      <defs>
        <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3c9"/><stop offset="1" stop-color="#ffc9a8"/></linearGradient>
        <linearGradient id="icing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9f2"/><stop offset="1" stop-color="#ffb8d3"/></linearGradient>
        <linearGradient id="icing2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe6ff"/><stop offset="1" stop-color="#cdb8ff"/></linearGradient>
        <radialGradient id="fl" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#fff7c2"/><stop offset=".55" stop-color="#ffcf6b"/><stop offset="1" stop-color="#ff8a5c"/></radialGradient>
        <radialGradient id="hl"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- plate -->
      <ellipse cx="150" cy="300" rx="136" ry="18" fill="#fff" opacity=".95"/>
      <ellipse cx="150" cy="296" rx="120" ry="13" fill="#f4e8ff"/>

      <!-- bottom tier -->
      <path d="M40 220 h220 v68 a110 14 0 0 1 -220 0z" fill="url(#sponge)"/>
      <path d="M40 220 h220 v26 H40z" fill="url(#icing)"/>
      <path d="M40 246 q10 22 22 0 q10 26 22 0 q10 22 22 0 q10 26 22 0 q10 22 22 0 q10 26 22 0 q10 22 22 0 q10 26 22 0 q10 22 22 0 q10 26 22 0 v-26 H40z" fill="url(#icing)"/>
      <ellipse cx="150" cy="220" rx="110" ry="14" fill="#fff0f6"/>
      <g fill="#fff"><circle cx="70" cy="268" r="5"/><circle cx="105" cy="274" r="5"/><circle cx="150" cy="270" r="5"/><circle cx="195" cy="274" r="5"/><circle cx="230" cy="268" r="5"/></g>
      <g fill="var(--rose)"><circle cx="87" cy="266" r="3.5"/><circle cx="128" cy="276" r="3.5"/><circle cx="172" cy="276" r="3.5"/><circle cx="213" cy="266" r="3.5"/></g>

      <!-- top tier -->
      <path d="M78 150 h144 v62 a72 10 0 0 1 -144 0z" fill="url(#sponge)"/>
      <path d="M78 150 h144 v24 H78z" fill="url(#icing2)"/>
      <path d="M78 174 q9 20 18 0 q9 24 18 0 q9 20 18 0 q9 24 18 0 q9 20 18 0 q9 24 18 0 q9 20 18 0 q9 24 18 0 v-24 H78z" fill="url(#icing2)"/>
      <ellipse cx="150" cy="150" rx="72" ry="10" fill="#f7f2ff"/>
      <g fill="#fff"><circle cx="105" cy="196" r="4"/><circle cx="150" cy="200" r="4"/><circle cx="195" cy="196" r="4"/></g>
      <g fill="var(--rose)"><circle cx="127" cy="198" r="3"/><circle cx="173" cy="198" r="3"/></g>

      <!-- cherries & mini hearts on top -->
      <circle cx="108" cy="143" r="8" fill="#e8365f"/><circle cx="105" cy="140" r="2.2" fill="#fff" opacity=".8"/>
      <circle cx="192" cy="143" r="8" fill="#e8365f"/><circle cx="189" cy="140" r="2.2" fill="#fff" opacity=".8"/>
      <path d="M108 135 q4 -10 10 -14" stroke="#6bb36b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M192 135 q-4 -10 -10 -14" stroke="#6bb36b" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- candle -->
      <rect x="141" y="82" width="18" height="64" rx="5" fill="#fff"/>
      <path d="M141 96 l18 -8 M141 110 l18 -8 M141 124 l18 -8 M141 138 l18 -8" stroke="var(--rose)" stroke-width="5" opacity=".55"/>
      <rect x="149" y="74" width="2.4" height="10" rx="1" fill="#5d3358"/>

      <!-- smoke after blowing out -->
      <g class="smoke">
        <path d="M150 72 q-9 -12 0 -22 q9 -10 0 -20" stroke="#bda8d6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- clickable flame (big invisible hit-area for easy tapping) -->
      <g class="flame-btn" id="flameBtn" role="button" tabindex="0" aria-label="Tap the candle flame to blow it out">
        <circle class="halo" cx="150" cy="56" r="30" fill="url(#hl)"/>
        <circle class="tap-ring" cx="150" cy="56" r="20"/>
        <path class="flame" d="M150 30 C163 46 168 58 160 70 C156 76 144 76 140 70 C132 58 140 46 150 30z" fill="url(#fl)"/>
        <ellipse cx="150" cy="64" rx="4" ry="7" fill="#fffbe0" opacity=".9"/>
        <circle class="hit" cx="150" cy="54" r="34"/>
      </g>
    </svg>
  </div>
  <p class="hint">tap the flame 🕯️</p>
</main>

<!-- ================= PAGE 2 ================= -->
<section class="page" id="page2" aria-live="polite">
  <div class="card">
    <span class="envelope" aria-hidden="true">🎁</span>
    <h1>Happy Birthday, Ilyas! 🎉</h1>
    <span class="badge">Future CA in the making 📊</span>
    <p class="divider" aria-hidden="true">✦ ✦ ✦</p>
    <p class="wish" id="wish"></p>
    <p class="extra" id="extra">Stay blessed, stay happy, and keep shining. Future CA Ilyas, the best is yet to come! 🌟</p>
    <div class="btns">
      <button id="moreBtn" hidden>One More Surprise 💝</button>
      <button id="replayBtn" class="ghost">Replay ✨</button>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  /* ---------- DOM ---------- */
  var page1 = document.getElementById('page1');
  var page2 = document.getElementById('page2');
  var cake = document.getElementById('cake');
  var flameBtn = document.getElementById('flameBtn');
  var wishEl = document.getElementById('wish');
  var extra = document.getElementById('extra');
  var moreBtn = document.getElementById('moreBtn');
  var replayBtn = document.getElementById('replayBtn');
  var fx = document.getElementById('fx');
  var heartsLayer = document.getElementById('hearts');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var blown = false;
  var typeTimer = null;
  var pageTimer = null;

  /* ---------- BUNTING FLAGS + BALLOONS ---------- */
  (function decorate() {
    var bunting = document.getElementById('bunting');
    var flagColors = ['#ff8fb8', '#ffd36b', '#b9a2ff', '#8fe3d0', '#ffb3cf'];
    var n = Math.max(8, Math.round(window.innerWidth / 70));
    for (var i = 0; i < n; i++) {
      var f = document.createElement('span');
      f.className = 'flag';
      f.style.setProperty('--c', flagColors[i % flagColors.length]);
      f.style.animationDelay = (i * -0.35) + 's';
      bunting.appendChild(f);
    }
    var spots = [
      { side: 'left', x: '2%', c: '#ff8fb8', d: '0s', far: false },
      { side: 'left', x: '9%', c: '#b9a2ff', d: '-1.5s', far: true },
      { side: 'right', x: '2%', c: '#ffd36b', d: '-0.8s', far: false },
      { side: 'right', x: '9%', c: '#8fe3d0', d: '-2.4s', far: true }
    ];
    spots.forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'balloon' + (b.far ? ' far' : '');
      el.style[b.side] = b.x;
      el.style.setProperty('--c', b.c);
      el.style.animationDelay = b.d;
      heartsLayer.appendChild(el);
    });
  })();

  /* ---------- AUDIO: real song + party popper (with Web Audio fallbacks) ---------- */
  var musicBtn = document.getElementById('musicBtn');
  var songEl = document.getElementById('songAudio');   // audio/happy-birthday.mp3 (human vocals)
  var popEl = document.getElementById('popAudio');     // audio/party-popper.mp3
  var songFailed = false, popFailed = false, songPlaying = false, fadeTimer = null;
  // If a file is missing / blocked, remember it and use the built-in fallback instead
  songEl.addEventListener('error', function () { songFailed = true; });
  popEl.addEventListener('error', function () { popFailed = true; });
  songEl.addEventListener('ended', function () { setMusicUI(false); });

  /* --- fallback engine (only used when an audio file can't be loaded) --- */
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null, master = null, synthNodes = [], synthTimer = null;
  var G4 = 392, A4 = 440, B4 = 493.88, C5 = 523.25, D5 = 587.33, E5 = 659.25, F5 = 698.46, G5 = 783.99;
  var MELODY = [
    [G4,.75],[G4,.25],[A4,1],[G4,1],[C5,1],[B4,2],
    [G4,.75],[G4,.25],[A4,1],[G4,1],[D5,1],[C5,2],
    [G4,.75],[G4,.25],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1],
    [F5,.75],[F5,.25],[E5,1],[C5,1],[D5,1],[C5,2]
  ];
  var BEAT = 0.5;

  function setMusicUI(on) {
    songPlaying = on;
    musicBtn.textContent = on ? '🎵' : '🔇';
    musicBtn.classList.toggle('playing', on);
    var label = on ? 'Turn music off' : 'Turn music on';
    musicBtn.setAttribute('aria-label', label);
    musicBtn.title = label;
  }

  // Called inside the flame-tap (a user gesture) so browsers allow audio later
  function unlockAudio(skipPrime) {
    if (AudioCtx) {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        var b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
        src.buffer = b; src.connect(actx.destination); src.start(0);
      } catch (e) { actx = null; }
    }
    if (skipPrime) return;
    // "prime" the song element silently so it may start a moment later (needed on iOS/Safari)
    try {
      songEl.muted = true;
      var p = songEl.play();
      var done = function () { songEl.pause(); songEl.currentTime = 0; songEl.muted = false; };
      if (p && p.then) { p.then(done).catch(function () { songEl.muted = false; }); } else { done(); }
    } catch (e) { songEl.muted = false; }
  }

  function synthSong() {
    if (!actx) { setMusicUI(false); return; }
    if (actx.state === 'suspended') actx.resume();
    master = actx.createGain(); master.gain.value = 0.22; master.connect(actx.destination);
    var t = actx.currentTime + 0.15, mine = [];
    MELODY.forEach(function (n) {
      var dur = n[1] * BEAT;
      [['triangle', n[0], 1], ['sine', n[0] * 2, 0.25]].forEach(function (v) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = v[0]; o.frequency.value = v[1];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(v[2], t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + dur); mine.push(o);
      });
      t += dur;
    });
    synthNodes = mine;
    setMusicUI(true);
    synthTimer = setTimeout(function () { synthNodes = []; setMusicUI(false); }, (t - actx.currentTime) * 1000 + 300);
  }

  function stopSynth() {
    clearTimeout(synthTimer);
    if (actx && master) {
      try { master.gain.setTargetAtTime(0, actx.currentTime, 0.03); } catch (e) {}
      var old = synthNodes;
      setTimeout(function () { old.forEach(function (o) { try { o.stop(); } catch (e) {} }); }, 150);
    }
    synthNodes = [];
  }

  /* --- song controls --- */
  function stopSong() {
    clearInterval(fadeTimer);
    try { songEl.pause(); songEl.currentTime = 0; songEl.volume = 1; } catch (e) {}
    stopSynth();
    setMusicUI(false);
  }

  // loop = true keeps it going while the wishes are being typed; fadeOutSong() ends it
  function playSong(loop) {
    stopSong();
    if (songFailed) { synthSong(); return; }
    songEl.loop = !!loop;
    var p = songEl.play();
    if (p && p.then) {
      p.then(function () { setMusicUI(true); }).catch(function (err) {
        if (err && err.name === 'NotAllowedError') { setMusicUI(false); }   // blocked: visitor can tap 🔇
        else { songFailed = true; synthSong(); }                            // file missing: fallback
      });
    } else { setMusicUI(true); }
  }

  // Gentle fade-out when the wishes finish
  function fadeOutSong() {
    if (!songPlaying) return;
    if (synthNodes.length) { stopSynth(); setMusicUI(false); return; }
    songEl.loop = false;
    var v = 1;
    clearInterval(fadeTimer);
    fadeTimer = setInterval(function () {
      v -= 0.08;
      if (v <= 0) { stopSong(); return; }
      try { songEl.volume = v; } catch (e) { stopSong(); }
    }, 100);
  }

  /* --- party popper sound (plays once per confetti burst) --- */
  function popSynth() {
    if (!actx) return;
    var t = actx.currentTime, sr = actx.sampleRate, len = Math.floor(sr * 0.35);
    var buf = actx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var src = actx.createBufferSource(); src.buffer = buf;
    var hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    var g = actx.createGain(); g.gain.value = 0.5;
    src.connect(hp); hp.connect(g); g.connect(actx.destination); src.start(t);
    var o = actx.createOscillator(), og = actx.createGain();
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
    og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(og); og.connect(actx.destination); o.start(t); o.stop(t + 0.2);
  }
  function playPop() {
    if (!popFailed) {
      try {
        popEl.currentTime = 0;
        var p = popEl.play();
        if (p && p.catch) p.catch(function () { popFailed = true; popSynth(); });
        return;
      } catch (e) {}
    }
    popSynth();
  }

  musicBtn.addEventListener('click', function () {
    unlockAudio(true);
    if (songPlaying) stopSong(); else playSong(false);   // manual replay plays the song once
  });

  /* ---------- THE BIRTHDAY WISH (edit freely!) ---------- */
  var WISH =
    "Wishing you a very Happy Birthday, Ilyas! 🎉 I hope today is full of smiles, good food, and people who make you laugh.\n\n" +
    "This year, I wish you great success, especially in your CA journey. I know it takes a lot of hard work, long study hours, and patience, " +
    "but I truly believe your effort will pay off. May every exam go smoothly and every attempt end with good news.\n\n" +
    "Most of all, I wish you good health, peace of mind, and lots of happiness. Take care of yourself along the way. " +
    "Stay blessed, stay happy, and keep going. You've got this! 🌟";

  /* ---------- HELPERS ---------- */
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* ---------- FLOATING HEARTS (background) ---------- */
  var HEARTS = ['🎈', '✨', '⭐', '🎉', '💫', '💜', '🎊', '🌟'];
  function spawnHeart() {
    if (document.hidden) return;
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = pick(HEARTS);
    h.style.left = rand(2, 96) + 'vw';
    h.style.fontSize = rand(14, 30) + 'px';
    var dur = rand(7, 13);
    h.style.animationDuration = dur + 's';
    h.style.setProperty('--sway', rand(-60, 60) + 'px');
    h.style.setProperty('--rot', rand(-40, 40) + 'deg');
    heartsLayer.appendChild(h);
    setTimeout(function () { h.remove(); }, dur * 1000 + 200);
  }
  if (!reduceMotion) { setInterval(spawnHeart, 900); for (var i = 0; i < 5; i++) setTimeout(spawnHeart, i * 250); }

  /* static twinkles */
  for (var t = 0; t < 14; t++) {
    var s = document.createElement('span');
    s.className = 'twinkle';
    s.textContent = '✦';
    s.style.left = rand(3, 96) + 'vw';
    s.style.top = rand(3, 94) + 'vh';
    s.style.fontSize = rand(10, 20) + 'px';
    s.style.animationDelay = rand(0, 3) + 's';
    heartsLayer.appendChild(s);
  }

  /* ---------- SPARKLES (burst from candle) ---------- */
  function sparkleBurst() {
    var r = flameBtn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 22; i++) {
      var sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = pick(['✨', '⭐', '💫', '✦']);
      sp.style.left = cx + 'px';
      sp.style.top = cy + 'px';
      sp.style.fontSize = rand(14, 26) + 'px';
      var ang = rand(0, Math.PI * 2), dist = rand(60, 160);
      sp.style.setProperty('--sx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--sy', Math.sin(ang) * dist + 'px');
      fx.appendChild(sp);
      setTimeout((function (n) { return function () { n.remove(); }; })(sp), 1000);
    }
  }

  /* ---------- CONFETTI ---------- */
  var COLORS = ['#ff8fb8', '#ffd36b', '#b9a2ff', '#8fe3d0', '#ffb3cf', '#fff'];
  function confetti(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('i');
      c.className = 'conf';
      var size = rand(7, 13);
      c.style.width = size + 'px';
      c.style.height = size * rand(.5, 1.4) + 'px';
      c.style.background = pick(COLORS);
      c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      c.style.left = rand(0, 100) + 'vw';
      var dur = rand(2.2, 4.2);
      c.style.setProperty('--dur', dur + 's');
      c.style.setProperty('--dx', rand(-120, 120) + 'px');
      c.style.setProperty('--spin', rand(-720, 720) + 'deg');
      c.style.animationDelay = rand(0, .6) + 's';
      fx.appendChild(c);
      setTimeout((function (n) { return function () { n.remove(); }; })(c), (dur + .8) * 1000);
    }
  }

  /* ---------- TYPING EFFECT ---------- */
  function typeWish() {
    clearInterval(typeTimer);
    wishEl.textContent = '';
    if (reduceMotion) { wishEl.textContent = WISH; moreBtn.hidden = false; songEl.loop = false; return; }
    var caret = document.createElement('span');
    caret.className = 'caret';
    var textNode = document.createTextNode('');
    wishEl.appendChild(textNode);
    wishEl.appendChild(caret);
    var i = 0;
    typeTimer = setInterval(function () {
      i++;
      textNode.nodeValue = WISH.slice(0, i);
      if (i >= WISH.length) {
        clearInterval(typeTimer);
        caret.remove();
        moreBtn.hidden = false;      // button appears once message is done
        fadeOutSong();               // wishes finished: music fades out
      }
    }, 28);
  }

  /* ---------- BLOW OUT THE CANDLE ---------- */
  function blowOut() {
    if (blown) return;
    blown = true;
    unlockAudio();
    cake.classList.add('out');
    sparkleBurst();
    confetti(90);
    playPop();            // popper sound fires together with the burst
    clearTimeout(pageTimer);
    pageTimer = setTimeout(function () {
      page1.classList.remove('active');
      page2.classList.add('active');
      musicBtn.hidden = false;
      playSong(true);       // keeps playing while the wishes are typed
      setTimeout(typeWish, 700);
    }, 1700);
  }

  flameBtn.addEventListener('click', blowOut);
  flameBtn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blowOut(); }
  });

  /* ---------- ONE MORE SURPRISE ---------- */
  moreBtn.addEventListener('click', function () {
    extra.classList.add('show');
    confetti(50);
    playPop();
    moreBtn.hidden = true;
    setTimeout(function () { extra.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
  });

  /* ---------- REPLAY ---------- */
  replayBtn.addEventListener('click', function () {
    clearInterval(typeTimer);
    clearTimeout(pageTimer);
    stopSong();
    try { popEl.pause(); popEl.currentTime = 0; } catch (e) {}
    musicBtn.hidden = true;
    wishEl.textContent = '';
    extra.classList.remove('show');
    moreBtn.hidden = true;
    page2.classList.remove('active');
    page1.classList.add('active');
    cake.classList.remove('out');
    blown = false;
  });
})();
</script>
</body>
</html>
